<section class="py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <p class="text-uppercase text-muted mb-1">Admin</p>
      <h2 class="mb-0">Products</h2>
      <p class="text-muted small mb-0">Edit or remove products from the catalog.</p>
    </div>
  </div>

  <div class="d-flex flex-wrap justify-content-end gap-2 mb-4">
    <button class="btn btn-outline-light btn-sm admin-top-btn" data-admin-modal-open="modalAddCategory">Add Category</button>
    <button class="btn btn-outline-light btn-sm admin-top-btn" data-admin-modal-open="modalEditCategory">Edit Category</button>
    <button class="btn btn-outline-light btn-sm admin-top-btn" data-admin-modal-open="modalDeleteCategory">Delete Category</button>
    <button class="btn btn-primary btn-sm admin-top-btn" data-admin-modal-open="modalAddProduct">Add Product</button>
  </div>

  <div class="card shadow-sm mb-4 admin-card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table align-middle admin-table" id="adminProductsTable">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Name</th>
              <th scope="col">Description</th>
              <th scope="col">Price</th>
              <th scope="col">Stock</th>
              <th scope="col">Category</th>
              <th scope="col">Status</th>
              <th scope="col" class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="8" class="text-center py-3">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card shadow-sm d-none admin-card" id="productEditorCard">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Edit product</h5>
        <button type="button" class="btn btn-link text-decoration-none" onclick="document.getElementById('productEditorCard').classList.add('d-none')">Close</button>
      </div>
      <form id="productEditForm" class="row g-3">
        <div class="col-md-6">
          <label for="productName" class="form-label">Name</label>
          <input type="text" class="form-control" id="productName" required />
        </div>
        <div class="col-md-6">
          <label for="productPrice" class="form-label">Price</label>
          <input type="number" step="0.01" min="0" class="form-control" id="productPrice" required />
        </div>
        <div class="col-md-12">
          <label for="productDescription" class="form-label">Description</label>
          <textarea class="form-control" id="productDescription" rows="3" required></textarea>
        </div>
        <div class="col-md-6">
          <label for="productStock" class="form-label">Stock quantity</label>
          <input type="number" min="0" class="form-control" id="productStock" required />
        </div>
        <div class="col-md-6 d-flex align-items-center">
          <div class="form-check mt-3">
            <input class="form-check-input" type="checkbox" id="productAvailable" />
            <label class="form-check-label" for="productAvailable">Available for purchase</label>
          </div>
        </div>
        <div class="col-12 d-flex justify-content-end gap-2">
          <button type="reset" class="btn btn-outline-secondary" onclick="event.preventDefault(); document.getElementById('productEditForm').reset();">
            Reset
          </button>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modals -->
  <div class="admin-modal d-none" id="modalAddCategory">
    <div class="admin-modal__dialog">
      <div class="admin-modal__header">
        <h5 class="mb-0">Add Category</h5>
        <button type="button" class="btn-close-white" data-admin-modal-close>&times;</button>
      </div>
      <div class="admin-modal__body">
        <form id="adminAddCategoryForm" class="row g-2 needs-validation" novalidate>
          <div class="col-12">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" required />
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="2" required></textarea>
          </div>
          <div class="col-12 d-flex justify-content-end gap-2 admin-form-actions">
            <button type="reset" class="btn btn-outline-secondary">Reset</button>
            <button type="submit" class="btn btn-primary">Add</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="admin-modal d-none" id="modalEditCategory">
    <div class="admin-modal__dialog">
      <div class="admin-modal__header">
        <h5 class="mb-0">Edit Category</h5>
        <button type="button" class="btn-close-white" data-admin-modal-close>&times;</button>
      </div>
      <div class="admin-modal__body">
        <form id="adminEditCategoryForm" class="row g-2 needs-validation" novalidate>
          <div class="col-12">
            <label class="form-label">Select category</label>
            <select class="form-select" name="category_id" required></select>
          </div>
          <div class="col-12">
            <label class="form-label">New name (optional)</label>
            <input type="text" class="form-control" name="name" />
          </div>
          <div class="col-12">
            <label class="form-label">New description (optional)</label>
            <textarea class="form-control" name="description" rows="2"></textarea>
          </div>
          <div class="col-12 d-flex justify-content-end gap-2 admin-form-actions">
            <button type="reset" class="btn btn-outline-secondary">Reset</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="admin-modal d-none" id="modalAddProduct">
    <div class="admin-modal__dialog">
      <div class="admin-modal__header">
        <h5 class="mb-0">Add Product</h5>
        <button type="button" class="btn-close-white" data-admin-modal-close>&times;</button>
      </div>
      <div class="admin-modal__body">
        <form id="adminAddProductForm" class="row g-2 needs-validation" novalidate>
          <div class="col-12">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" required />
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="2" required></textarea>
          </div>
          <div class="col-6">
            <label class="form-label">Price</label>
            <input type="number" step="0.01" min="0" class="form-control" name="price" required />
          </div>
          <div class="col-6">
            <label class="form-label">Stock</label>
            <input type="number" min="0" class="form-control" name="stock_quantity" required />
          </div>
          <div class="col-12">
            <label class="form-label">Categories (multi-select)</label>
            <select class="form-select" name="category_ids" multiple required></select>
          </div>
          <div class="col-12">
            <label class="form-label">Status</label>
            <select class="form-select" name="is_available" required>
              <option value="1">Available</option>
              <option value="0">Unavailable</option>
            </select>
          </div>
          <div class="col-12 d-flex justify-content-end gap-2 admin-form-actions">
            <button type="reset" class="btn btn-outline-secondary">Reset</button>
            <button type="submit" class="btn btn-primary">Create</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="admin-modal d-none" id="modalDeleteCategory">
    <div class="admin-modal__dialog">
      <div class="admin-modal__header">
        <h5 class="mb-0">Delete Category</h5>
        <button type="button" class="btn-close-white" data-admin-modal-close>&times;</button>
      </div>
      <div class="admin-modal__body">
        <form id="adminDeleteCategoryForm" class="row g-2 needs-validation" novalidate>
          <div class="col-12">
            <label class="form-label">Select category</label>
            <select class="form-select" name="category_id" required></select>
          </div>
          <div class="col-12 d-flex justify-content-end gap-2 admin-form-actions">
            <button type="reset" class="btn btn-outline-secondary">Reset</button>
            <button type="submit" class="btn btn-primary">Delete</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
