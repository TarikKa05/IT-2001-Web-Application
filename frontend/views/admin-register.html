<section class="py-4 admin-wrapper">
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
    <div>
      <p class="text-uppercase text-muted mb-1">Admin</p>
      <h2 class="mb-0">Register Admin</h2>
      <p class="text-muted small mb-0">Create a new administrator account.</p>
    </div>
    <a class="btn btn-outline-light btn-sm admin-top-btn" href="#/admin/home">Back to Users</a>
  </div>

  <div class="card shadow-sm admin-card">
    <div class="card-body">
      <form id="adminRegistrationForm" class="row g-3 needs-validation" novalidate>
        <div class="col-md-6">
          <label for="adminUsername" class="form-label">Username</label>
          <input type="text" class="form-control" id="adminUsername" name="username" required />
        </div>
        <div class="col-md-6">
          <label for="adminEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="adminEmail" name="email" required />
        </div>
        <div class="col-md-6">
          <label for="adminPhone" class="form-label">Phone Number</label>
          <input type="tel" class="form-control" id="adminPhone" name="phone_number" required />
        </div>
        <div class="col-md-6">
          <label for="adminDob" class="form-label">Date of Birth</label>
          <input type="date" class="form-control" id="adminDob" name="date_of_birth" required />
        </div>
        <div class="col-md-6">
          <label for="adminFirstName" class="form-label">First Name</label>
          <input type="text" class="form-control" id="adminFirstName" name="first_name" required />
        </div>
        <div class="col-md-6">
          <label for="adminLastName" class="form-label">Last Name</label>
          <input type="text" class="form-control" id="adminLastName" name="last_name" required />
        </div>
        <div class="col-md-6">
          <label for="adminPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="adminPassword" name="password" required minlength="6" />
        </div>
        <div class="col-md-6">
          <label for="adminRepeatPassword" class="form-label">Repeat Password</label>
          <input type="password" class="form-control" id="adminRepeatPassword" name="repeatPassword" required minlength="6" />
        </div>
        <div class="col-12 d-flex justify-content-end gap-2 admin-form-actions">
          <button type="reset" class="btn btn-outline-secondary">Reset</button>
          <button type="submit" class="btn btn-primary">Create Admin</button>
        </div>
      </form>
    </div>
  </div>
</section>
