<section class="py-4 admin-wrapper">
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
    <div>
      <p class="text-uppercase text-muted mb-1">Admin</p>
      <h2 class="mb-0">Register User</h2>
      <p class="text-white small mb-0">Create a new user account.</p>
    </div>
    <a class="btn btn-outline-light btn-sm admin-top-btn" href="#/admin/home">Back to Users</a>
  </div>

  <div class="card shadow-sm admin-card">
    <div class="card-body">
      <form id="adminUserRegistrationForm" class="row g-3 needs-validation" novalidate>
        <div class="col-md-6">
          <label for="adminUserUsername" class="form-label">Username</label>
          <input type="text" class="form-control" id="adminUserUsername" name="username" required />
        </div>
        <div class="col-md-6">
          <label for="adminUserEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="adminUserEmail" name="email" required />
        </div>
        <div class="col-md-6">
          <label for="adminUserPhone" class="form-label">Phone Number</label>
          <input type="tel" class="form-control" id="adminUserPhone" name="phone_number" required />
        </div>
        <div class="col-md-6">
          <label for="adminUserDob" class="form-label">Date of Birth</label>
          <input type="date" class="form-control" id="adminUserDob" name="date_of_birth" required />
        </div>
        <div class="col-md-6">
          <label for="adminUserFirstName" class="form-label">First Name</label>
          <input type="text" class="form-control" id="adminUserFirstName" name="first_name" required />
        </div>
        <div class="col-md-6">
          <label for="adminUserLastName" class="form-label">Last Name</label>
          <input type="text" class="form-control" id="adminUserLastName" name="last_name" required />
        </div>
        <div class="col-md-6">
          <label for="adminUserPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="adminUserPassword" name="password" required minlength="6" />
        </div>
        <div class="col-md-6">
          <label for="adminUserRepeatPassword" class="form-label">Repeat Password</label>
          <input type="password" class="form-control" id="adminUserRepeatPassword" name="repeatPassword" required minlength="6" />
        </div>
        <div class="col-12 d-flex justify-content-end gap-2 admin-form-actions">
          <button type="reset" class="btn btn-outline-secondary">Reset</button>
          <button type="submit" class="btn btn-primary">Create User</button>
        </div>
      </form>
    </div>
  </div>
</section>
